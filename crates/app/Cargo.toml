[package]
name = "wayofaiming"
description = "Webcam-based shooting trainer: live aim trace, automatic shot detection, hold analysis"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
wayofaiming-core = { path = "../core" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
cpal = "0.18"
eframe = "0.37"
nokhwa = { version = "0.10", features = ["input-native"] }
